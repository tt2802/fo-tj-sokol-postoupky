name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install
      - name: Validate admin/data sync integrity
        run: npm run check:data-sync
      - name: Lint JavaScript
        run: npm run lint || echo "Lint warnings/errors ignored in CI"

      - name: Debug files
        run: ls -la

      - name: Build Eleventy site
        run: |
          # set production flag so transforms (minify) are applied
          ELEVENTY_ENV=production ELEVENTY_PATH_PREFIX=/fo-tj-sokol-postoupky/ npx @11ty/eleventy --config=.eleventy.cjs



      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
