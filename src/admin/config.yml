# file: src/admin/config.yml
backend:
  name: github
  repo: tt2802/fo-tj-sokol-postoupky
  branch: main
  base_url: https://decap-fo-tj-sokol-postoupky.tomasdanielkubin.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "news"
    label: "Novinky"
    folder: "src/news"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - label: "Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Perex", name: "excerpt", widget: "text", required: false }
      - { label: "Obsah", name: "body", widget: "markdown" }

  - name: "data"
    label: "Data"
    files:
      - name: "matches"
        label: "Zápasy"
        file: "src/_data/matches.json"
        fields:
          - label: "Zápasy"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} · {{fields.team}} · {{fields.home}} vs {{fields.away}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - label: "Tým"
                name: "team"
                widget: "select"
                options:
                  - { label: "Muži", value: "muzi" }
                  - { label: "Mládež", value: "mladez" }
              - { label: "Sezóna", name: "season", widget: "string" }
              - { label: "Soutěž", name: "competition", widget: "string" }
              - { label: "Kolo", name: "round", widget: "string" }
              - { label: "Datum", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Čas", name: "time", widget: "string", required: false }
              - { label: "Soupeř", name: "opponent", widget: "string" }
              - { label: "Domácí", name: "home", widget: "string" }
              - { label: "Hosté", name: "away", widget: "string" }
              - { label: "Jsme doma", name: "isHome", widget: "boolean", default: true }
              - { label: "Místo", name: "venue", widget: "string" }
              - { label: "Skóre domácí", name: "homeScore", widget: "number", required: false, value_type: "int" }
              - { label: "Skóre hosté", name: "awayScore", widget: "number", required: false, value_type: "int" }
              - { label: "Rozhodčí", name: "referee", widget: "string", required: false }
              - { label: "Report", name: "report", widget: "text", required: false }
              - { label: "Video URL", name: "videoUrl", widget: "string", required: false }

editor:
  preview: false
