# file: src/admin/config.yml
backend:
  name: github
  repo: tt2802/fo-tj-sokol-postoupky
  branch: main
  base_url: https://decap-fo-tj-sokol-postoupky.tomasdanielkubin.workers.dev
  auth_endpoint: auth
  
# Enable local backend for local testing (no auth required when running the proxy)
local_backend: true

site_url: https://tt2802.github.io/fo-tj-sokol-postoupky
display_url: https://tt2802.github.io/fo-tj-sokol-postoupky

# Store uploaded images inside the site's source assets so Eleventy can pick them up
media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

collections:
  - name: "news"
    label: "Novinky"
    label_singular: "Novinka"
    folder: "src/news"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    preview_url: "{{site_url}}/novinky/{{slug}}/"
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - label: "Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Perex", name: "excerpt", widget: "text", required: false }
      - { label: "Obsah", name: "body", widget: "markdown" }

  - name: "data"
    label: "Data"
    files:
      - name: "matches"
        label: "Zápasy"
        file: "src/_data/matches.json"
        preview_url: "{{site_url}}/zapasy/"
        fields:
          - label: "Zápasy"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.team}} · {{fields.home}} vs {{fields.away}}"
            fields:
              - label: "Slug (URL identifikátor)"
                name: "slug"
                widget: "string"
                required: false
                hint: "Automaticky se vygeneruje z data a týmů, pokud necháte prázdné"
                
              - label: "ID"
                name: "id"
                widget: "hidden"
                required: false

              ################################################################
              # NEJDŘÍV VYBER TYP ZÁPASU - TO URČUJE KTERÁ POLE VIDISH
              ################################################################
              - label: "🎯 Typ zápasu"
                name: "matchType"
                widget: "select"
                default: "upcoming"
                options:
                  - { label: "🟢 Nadcházející zápas", value: "upcoming" }
                  - { label: "⚪ Odehrané (skončené)", value: "played" }
                hint: "Vyber NEJDŘÍV! Určuje, která pole se budou vyplňovat."
                
              - label: "Tým"
                name: "team"
                widget: "select"
                default: "muzi"
                options:
                  - { label: "Muži", value: "muzi" }
                  - { label: "Mládež", value: "mladez" }

              - label: "Kategorie (pouze pro Mládež)"
                name: "category"
                widget: "select"
                required: false
                hint: "Vyber kategorii mládeže, pokud se jedná o mládež"
                options:
                  - { label: "Dorostenci", value: "dorostenci" }
                  - { label: "Dorostenkyně D19", value: "dorostenky-d19" }
                  - { label: "Starší žáci", value: "starsi-zaci" }
                  - { label: "Mladší žáci", value: "mlads-zaci" }
                  - { label: "Mladší žáci B", value: "mlads-zaci-b" }
                  - { label: "Školička", value: "skolicka" }

              - { label: "Sezóna", name: "season", widget: "string", default: "2025/2026", required: true }
              - { label: "Soutěž", name: "competition", widget: "string", required: true }
              - { label: "Kolo", name: "round", widget: "string", required: false }

              ################################################################
              # ZÁKLADNÍ INFO - VIDĚT PRO OBA TYPY
              ################################################################
              - label: "Datum"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY"
                time_format: false
                picker_utc: false

              - label: "Domácí"
                name: "home"
                widget: "string"
                required: true

              - label: "Hosté"
                name: "away"
                widget: "string"
                required: true

              - { label: "Jsme doma", name: "isHome", widget: "boolean", default: true }
              - { label: "Místo utkání", name: "venue", widget: "string" }

              ################################################################
              # POLE PRO NADCHÁZEJÍCÍ ZÁPASY (😃 jen když typ = upcoming)
              ################################################################
              - label: "Čas zápasu"
                name: "time"
                widget: "string"
                required: false
                hint: "Např. 18:00 (pro nadcházející zápas)"
                show_when:
                  field: "matchType"
                  value: "upcoming"

              ################################################################
              # POLE PRO ODEHRANÉ ZÁPASY (⚪ jen když typ = played)
              ################################################################
              - label: "💾 Konvertovat z nadcházejícího"
                name: "convertedFromSlug"
                widget: "string"
                required: false
                hint: "Pokud jsi kopíroval/a info z nadcházejícího - napiš jeho slug, aby se zmazal"
                show_when:
                  field: "matchType"
                  value: "played"

              - label: "Skóre domácích"
                name: "homeScore"
                widget: "number"
                required: false
                value_type: "int"
                hint: "Počet gólů domácích"
                show_when:
                  field: "matchType"
                  value: "played"

              - label: "Skóre hostů"
                name: "awayScore"
                widget: "number"
                required: false
                value_type: "int"
                hint: "Počet gólů hostů"
                show_when:
                  field: "matchType"
                  value: "played"

              - label: "Rozhodčí"
                name: "referee"
                widget: "string"
                required: false
                hint: "Jméno rozhodčího"
                show_when:
                  field: "matchType"
                  value: "played"

              - label: "Report ze zápasu"
                name: "report"
                widget: "text"
                required: false
                hint: "Zhodnocení, zajímavosti, klíčové chvíle..."
                show_when:
                  field: "matchType"
                  value: "played"

              - label: "Video URL"
                name: "videoUrl"
                widget: "string"
                required: false
                hint: "Odkaz na YouTube nebo video (je-li k dispozici)"

              - label: "Sestava"
                name: "lineup"
                widget: "list"
                required: false
                hint: "Hráči v základní sestavě"
                show_when:
                  field: "matchType"
                  value: "played"
                fields:
                  - { label: "Hráč", name: "player", widget: "string" }

              - label: "Střelci"
                name: "scorers"
                widget: "list"
                required: false
                hint: "Kdo skóroval a kolikrát"
                show_when:
                  field: "matchType"
                  value: "played"
                fields:
                  - { label: "Střelec", name: "scorer", widget: "string" }

              - label: "Karty"
                name: "cards"
                widget: "list"
                required: false
                hint: "Žluté/červené karty"
                show_when:
                  field: "matchType"
                  value: "played"
                fields:
                  - { label: "Karta", name: "card", widget: "string" }

              - label: "Střídání"
                name: "substitutions"
                widget: "list"
                required: false
                hint: "Střídání hráčů během zápasu"
                show_when:
                  field: "matchType"
                  value: "played"
                fields:
                  - { label: "Střídání", name: "substitution", widget: "string" }

      - name: "players"
        label: "Hráči"
        file: "src/_data/players.json"
        preview_url: "{{site_url}}/muzi/tym/"
        fields:
          - label: "Muži"
            name: "men"
            widget: "list"
            collapsed: true
            summary: "{{fields.number}} · {{fields.name}} ({{fields.position}})"
            fields:
              - { label: "Jméno", name: "name", widget: "string", required: true }
              - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
              - label: "Pozice"
                name: "position"
                widget: "select"
                options:
                  - { label: "Brankář", value: "Brankář" }
                  - { label: "Obránce", value: "Obránce" }
                  - { label: "Záložník", value: "Záložník" }
                  - { label: "Útočník", value: "Útočník" }
              - { label: "Fotka", name: "photo", widget: "image", required: false }

          - label: "Mládež"
            name: "youth"
            widget: "object"
            collapsed: false
            fields:
              - label: "Dorostenci"
                name: "dorostenci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Dorostenkyně D19"
                name: "dorostenky-d19"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Starší žáci"
                name: "starsi-zaci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Mladší žáci"
                name: "mlads-zaci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Mladší žáci B"
                name: "mlads-zaci-b"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Školička"
                name: "skolicka"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

      - name: "staff"
        label: "Realizační tým"
        file: "src/_data/staff.json"
        fields:
          - label: "Osoby"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.role}} · {{fields.name}}"
            fields:
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Kontakt", name: "contact", widget: "string", required: false }
              - { label: "Telefon", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Fotka", name: "photo", widget: "image", required: false }

      - name: "gallery"
        label: "Galerie"
        file: "src/_data/gallery.yml"
        preview_url: "{{site_url}}/galerie/"
        fields:
          - label: "Alba"
            name: "albums"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - { label: "Název alba", name: "title", widget: "string" }
              - label: "Datum"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - { label: "Slug", name: "slug", widget: "string", hint: "např. soustredeni-2026", required: true }
              - { label: "Úvodní fotka", name: "cover", widget: "image", required: false }
              - label: "Fotky"
                name: "photos"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Fotka", name: "photo", widget: "image" }

      - name: "sponsors"
        label: "Partneři"
        file: "src/_data/sponsors.json"
        fields:
          - label: "Partneři"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "Název", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Odkaz", name: "url", widget: "string", required: false }

      - name: "contacts"
        label: "Kontakty"
        file: "src/_data/contacts.yml"
        fields:
          - { label: "Adresa", name: "address", widget: "string", required: false }
          - { label: "Mapa URL", name: "mapUrl", widget: "string", required: false }
          - label: "Kontaktní osoby"
            name: "people"
            widget: "list"
            collapsed: true
            summary: "{{fields.role}} · {{fields.name}}"
            fields:
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Tréninky"
            name: "trainings"
            widget: "list"
            collapsed: true
            summary: "{{fields.team}} · {{fields.day}} {{fields.time}}"
            fields:
              - { label: "Tým", name: "team", widget: "string" }
              - { label: "Den", name: "day", widget: "string" }
              - { label: "Čas", name: "time", widget: "string" }
              - { label: "Místo", name: "place", widget: "string", required: false }

      - name: "categories"
        label: "Kategorie mládeže"
        file: "src/_data/categories.json"
        fields:
          - label: "Kategorie"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} ({{fields.shortName}})"
            fields:
              - { label: "ID", name: "id", widget: "string", required: true, hint: "např. dorostenci" }
              - { label: "Název", name: "name", widget: "string", required: true }
              - { label: "Zkratka", name: "shortName", widget: "string", required: true, hint: "např. U19" }

editor:
  preview: false
