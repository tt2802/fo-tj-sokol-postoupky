# file: src/admin/config.yml
backend:
  name: github
  repo: tt2802/fo-tj-sokol-postoupky
  branch: main
  base_url: https://decap-fo-tj-sokol-postoupky.tomasdanielkubin.workers.dev
  auth_endpoint: auth
  
# Enable local backend for local testing (no auth required when running the proxy)
local_backend: true

site_url: https://tt2802.github.io/fo-tj-sokol-postoupky
display_url: https://tt2802.github.io/fo-tj-sokol-postoupky

# Store uploaded images inside the site's source assets so Eleventy can pick them up
media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

commit_messages:
  create: "chore(cms): vytvořen obsah {{collection}}/{{slug}}"
  update: "chore(cms): upraven obsah {{collection}}/{{slug}}"
  delete: "chore(cms): smazán obsah {{collection}}/{{slug}}"
  uploadMedia: "chore(cms): nahrán soubor {{path}}"
  deleteMedia: "chore(cms): smazán soubor {{path}}"

collections:
  - name: "news"
    label: "Novinky"
    label_singular: "Novinka"
    folder: "src/news"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    preview_url: "{{site_url}}/novinky/{{slug}}/"
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - label: "Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Perex", name: "excerpt", widget: "text", required: false }
      - { label: "Obsah", name: "body", widget: "markdown" }

  - name: "data"
    label: "Data"
    files:
      - name: "upcoming_matches"
        label: "Nadcházející zápasy"
        file: "src/_data/upcoming_matches.json"
        preview_url: "{{site_url}}/zapasy/"
        fields:
          - label: "Nadcházející zápasy"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.team}} · {{fields.home}} vs {{fields.away}}"
            fields:
              - label: "Slug (URL)"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Použij jen malá písmena, čísla a pomlčky (např. 2026-03-10-postoupky-hulin)"]
                hint: "Pouze malá písmena, čísla a pomlčky. Bez mezer a diakritiky."
                required: true
                
              - label: "ID"
                name: "id"
                widget: "hidden"
                required: false

              - label: "Tým"
                name: "team"
                widget: "select"
                default: "muzi"
                options:
                  - { label: "Muži", value: "muzi" }
                  - { label: "Mládež", value: "mladez" }

              - label: "Kategorie (pouze pro Mládež)"
                name: "category"
                widget: "select"
                required: false
                options:
                  - { label: "Dorostenci", value: "dorostenci" }
                  - { label: "Dorostenkyně D19", value: "dorostenky-d19" }
                  - { label: "Starší žáci", value: "starsi-zaci" }
                  - { label: "Mladší žáci", value: "mlads-zaci" }
                  - { label: "Mladší žáci B", value: "mlads-zaci-b" }
                  - { label: "Školička", value: "skolicka" }

              - { label: "Sezóna", name: "season", widget: "string", default: "2025/2026", required: true }
              - { label: "Soutěž", name: "competition", widget: "string", required: true }
              - { label: "Kolo", name: "round", widget: "string", required: false }
              - label: "Datum"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY"
                time_format: false
                picker_utc: false
              - label: "Domácí"
                name: "home"
                widget: "string"
                required: true
              - label: "Hosté"
                name: "away"
                widget: "string"
                required: true
              - { label: "Jsme doma", name: "isHome", widget: "boolean", default: true }
              - { label: "Místo utkání", name: "venue", widget: "string" }
              - label: "Čas zápasu"
                name: "time"
                widget: "string"
                required: false

      - name: "played_matches"
        label: "Odehrané zápasy"
        file: "src/_data/played_matches.json"
        preview_url: "{{site_url}}/zapasy/"
        fields:
          - label: "Odehrané zápasy"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.team}} · {{fields.homeScore}}:{{fields.awayScore}}"
            fields:
              - label: "Slug (URL)"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Použij jen malá písmena, čísla a pomlčky (např. 2026-03-10-postoupky-hulin)"]
                hint: "Pouze malá písmena, čísla a pomlčky. Bez mezer a diakritiky."
                required: false
                
              - label: "ID"
                name: "id"
                widget: "hidden"
                required: false

              - label: "Převzít z nadcházejícího zápasu"
                name: "relatedUpcoming"
                widget: "match-selector"
                required: false

              - label: "Tým"
                name: "team"
                widget: "select"
                default: "muzi"
                options:
                  - { label: "Muži", value: "muzi" }
                  - { label: "Mládež", value: "mladez" }

              - label: "Kategorie (pouze pro Mládež)"
                name: "category"
                widget: "select"
                required: false
                options:
                  - { label: "Dorostenci", value: "dorostenci" }
                  - { label: "Dorostenkyně D19", value: "dorostenky-d19" }
                  - { label: "Starší žáci", value: "starsi-zaci" }
                  - { label: "Mladší žáci", value: "mlads-zaci" }
                  - { label: "Mladší žáci B", value: "mlads-zaci-b" }
                  - { label: "Školička", value: "skolicka" }

              - { label: "Sezóna", name: "season", widget: "string", default: "2025/2026", required: true }
              - { label: "Soutěž", name: "competition", widget: "string", required: false }
              - { label: "Kolo", name: "round", widget: "string", required: false }
              - label: "Datum"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY"
                time_format: false
                picker_utc: false
                required: false
              - label: "Domácí"
                name: "home"
                widget: "string"
                required: false
              - label: "Hosté"
                name: "away"
                widget: "string"
                required: false
              - { label: "Jsme doma", name: "isHome", widget: "boolean", default: true }
              - { label: "Místo utkání", name: "venue", widget: "string" }

              - label: "Skóre domácích"
                name: "homeScore"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Skóre hostů"
                name: "awayScore"
                widget: "number"
                required: false
                value_type: "int"

              - label: "Rozhodčí"
                name: "referee"
                widget: "string"
                required: false

              - label: "Report ze zápasu"
                name: "report"
                widget: "text"
                required: false

              - label: "Video URL"
                name: "videoUrl"
                widget: "string"
                required: false

              - label: "Sestava"
                name: "lineup"
                widget: "lineup-picker"
                required: false

              - label: "Střelci gólů"
                name: "scorers"
                widget: "list"
                required: false
                fields:
                  - { label: "Střelec", name: "scorer", widget: "player-select" }

              - label: "Karty"
                name: "cards"
                widget: "list"
                required: false
                fields:
                  - { label: "Hráč", name: "player", widget: "player-select" }
                  - label: "Typ karty"
                    name: "cardType"
                    widget: "select"
                    options:
                      - { label: "Žlutá karta", value: "yellow" }
                      - { label: "Červená karta", value: "red" }

              - label: "Střídání"
                name: "substitutions"
                widget: "list"
                required: false
                fields:
                  - { label: "Střídá (ven)", name: "playerOut", widget: "player-select" }
                  - { label: "Za (dovnitř)", name: "playerIn", widget: "player-select" }

      - name: "players"
        label: "Hráči"
        file: "src/_data/players.json"
        preview_url: "{{site_url}}/muzi/tym/"
        fields:
          - label: "Muži"
            name: "men"
            widget: "list"
            collapsed: true
            summary: "{{fields.number}} · {{fields.name}} ({{fields.position}})"
            fields:
              - { label: "Jméno", name: "name", widget: "string", required: true }
              - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
              - label: "Pozice"
                name: "position"
                widget: "select"
                options:
                  - { label: "Brankář", value: "Brankář" }
                  - { label: "Obránce", value: "Obránce" }
                  - { label: "Záložník", value: "Záložník" }
                  - { label: "Útočník", value: "Útočník" }
              - { label: "Fotka", name: "photo", widget: "image", required: false }

          - label: "Mládež"
            name: "youth"
            widget: "object"
            collapsed: false
            fields:
              - label: "Dorostenci"
                name: "dorostenci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Dorostenkyně D19"
                name: "dorostenky-d19"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Starší žáci"
                name: "starsi-zaci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Mladší žáci"
                name: "mlads-zaci"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Mladší žáci B"
                name: "mlads-zaci-b"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

              - label: "Školička"
                name: "skolicka"
                widget: "list"
                collapsed: true
                summary: "{{fields.number}} · {{fields.name}}"
                fields:
                  - { label: "Jméno", name: "name", widget: "string", required: true }
                  - { label: "Číslo", name: "number", widget: "number", value_type: "int", required: false }
                  - label: "Pozice"
                    name: "position"
                    widget: "select"
                    options:
                      - { label: "Brankář", value: "Brankář" }
                      - { label: "Obránce", value: "Obránce" }
                      - { label: "Záložník", value: "Záložník" }
                      - { label: "Útočník", value: "Útočník" }
                  - { label: "Fotka", name: "photo", widget: "image", required: false }

      - name: "staff"
        label: "Realizační tým"
        file: "src/_data/staff.json"
        fields:
          - label: "Osoby"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.role}} · {{fields.name}}"
            fields:
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Kontakt", name: "contact", widget: "string", required: false }
              - { label: "Telefon", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Fotka", name: "photo", widget: "image", required: false }

      - name: "formation"
        label: "Sestava (formace)"
        file: "src/_data/formation.json"
        preview_url: "{{site_url}}/muzi/tym/"
        fields:
          - label: "Rozestavení"
            name: "formation"
            widget: "select"
            options:
              - { label: "4-4-2", value: "4-4-2" }
              - { label: "4-3-3", value: "4-3-3" }
              - { label: "4-2-3-1", value: "4-2-3-1" }
              - { label: "3-5-2", value: "3-5-2" }
              - { label: "3-4-3", value: "3-4-3" }
              - { label: "5-3-2", value: "5-3-2" }
              - { label: "5-4-1", value: "5-4-1" }
              - { label: "4-1-4-1", value: "4-1-4-1" }
              - { label: "4-5-1", value: "4-5-1" }
            default: "4-4-2"
          - label: "Pozice"
            name: "positions"
            widget: "list"
            collapsed: true
            max: 11
            summary: "{{fields.slot}} → {{fields.player}}"
            fields:
              - label: "Slot"
                name: "slot"
                widget: "select"
                options:
                  - { label: "GK (Brankář)", value: "GK" }
                  - { label: "LB (Levý bek)", value: "LB" }
                  - { label: "CB1 (Stoper 1)", value: "CB1" }
                  - { label: "CB2 (Stoper 2)", value: "CB2" }
                  - { label: "CB3 (Stoper 3)", value: "CB3" }
                  - { label: "RB (Pravý bek)", value: "RB" }
                  - { label: "LWB (Levý wingback)", value: "LWB" }
                  - { label: "RWB (Pravý wingback)", value: "RWB" }
                  - { label: "CDM (Defenzivní záložník)", value: "CDM" }
                  - { label: "CDM2 (Def. záložník 2)", value: "CDM2" }
                  - { label: "LM (Levý záložník)", value: "LM" }
                  - { label: "CM1 (Střední záložník 1)", value: "CM1" }
                  - { label: "CM2 (Střední záložník 2)", value: "CM2" }
                  - { label: "CM3 (Střední záložník 3)", value: "CM3" }
                  - { label: "RM (Pravý záložník)", value: "RM" }
                  - { label: "CAM (Ofenzivní záložník)", value: "CAM" }
                  - { label: "LW (Levé křídlo)", value: "LW" }
                  - { label: "RW (Pravé křídlo)", value: "RW" }
                  - { label: "ST1 (Útočník 1)", value: "ST1" }
                  - { label: "ST2 (Útočník 2)", value: "ST2" }
                  - { label: "CF (Střední útočník)", value: "CF" }
              - { label: "Hráč", name: "player", widget: "string", required: false, hint: "Jméno hráče" }

      - name: "calendar_events"
        label: "Kalendář akcí"
        file: "src/_data/calendar_events.json"
        fields:
          - label: "Události"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.type}} · {{fields.title}}"
            fields:
              - { label: "Název", name: "title", widget: "string", required: true }
              - label: "Typ"
                name: "type"
                widget: "select"
                options:
                  - { label: "Trénink", value: "training" }
                  - { label: "Turnaj", value: "tournament" }
                  - { label: "Soustředění", value: "camp" }
                  - { label: "Schůze", value: "meeting" }
                  - { label: "Jiné", value: "other" }
              - label: "Datum"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD.MM.YYYY"
                time_format: false
                picker_utc: false
              - { label: "Čas od", name: "time", widget: "string", required: false, hint: "Např. 18:00" }
              - { label: "Čas do", name: "endTime", widget: "string", required: false, hint: "Např. 19:30" }
              - { label: "Místo", name: "location", widget: "string", required: false }
              - { label: "Popis", name: "description", widget: "text", required: false }
              - label: "Tým"
                name: "team"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "Všechny", value: "" }
                  - { label: "Muži", value: "muzi" }
                  - { label: "Mládež", value: "mladez" }

      - name: "gallery"
        label: "Galerie"
        file: "src/_data/gallery.yml"
        preview_url: "{{site_url}}/galerie/"
        fields:
          - label: "Alba"
            name: "albums"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - { label: "Název alba", name: "title", widget: "string" }
              - label: "Datum"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - { label: "Slug", name: "slug", widget: "string", hint: "např. soustredeni-2026", required: true }
              - { label: "Úvodní fotka", name: "cover", widget: "image", required: false }
              - label: "Fotky"
                name: "photos"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Fotka", name: "photo", widget: "image" }

      - name: "sponsors"
        label: "Partneři"
        file: "src/_data/sponsors.json"
        fields:
          - label: "Partneři"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "Název", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Odkaz", name: "url", widget: "string", required: false }

      - name: "contacts"
        label: "Kontakty"
        file: "src/_data/contacts.yml"
        fields:
          - { label: "Adresa", name: "address", widget: "string", required: false }
          - { label: "Mapa URL", name: "mapUrl", widget: "string", required: false }
          - label: "Kontaktní osoby"
            name: "people"
            widget: "list"
            collapsed: true
            summary: "{{fields.role}} · {{fields.name}}"
            fields:
              - { label: "Jméno", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Tréninky"
            name: "trainings"
            widget: "list"
            collapsed: true
            summary: "{{fields.team}} · {{fields.day}} {{fields.time}}"
            fields:
              - { label: "Tým", name: "team", widget: "string" }
              - { label: "Den", name: "day", widget: "string" }
              - { label: "Čas", name: "time", widget: "string" }
              - { label: "Místo", name: "place", widget: "string", required: false }

      - name: "categories"
        label: "Kategorie mládeže"
        file: "src/_data/categories.json"
        fields:
          - label: "Kategorie"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} ({{fields.shortName}})"
            fields:
              - { label: "ID", name: "id", widget: "string", required: true, hint: "např. dorostenci", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "ID může obsahovat jen malá písmena, čísla a pomlčky."] }
              - { label: "Název", name: "name", widget: "string", required: true }
              - { label: "Zkratka", name: "shortName", widget: "string", required: true, hint: "např. U19" }

      - name: "site"
        label: "Nastavení webu"
        file: "src/_data/site.json"
        fields:
          - { label: "URL webu", name: "url", widget: "string", required: true, hint: "Např. https://tt2802.github.io/fo-tj-sokol-postoupky" }
